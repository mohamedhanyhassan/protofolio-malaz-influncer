<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة تحكم البورتفوليو — ملاذ</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
body{background:var(--surface)}
.abar{position:sticky;top:0;z-index:30;background:var(--black);color:#fff}
.abar .wrap{display:flex;align-items:center;gap:10px;height:64px;flex-wrap:wrap;max-width:1500px}
.abar .logo{font-size:26px;color:#fff;margin-inline-end:auto}
.abar .logo small{font-family:var(--fb);font-weight:400;font-size:13px;color:#bdb6aa;margin-inline-start:10px}
.abar .btn{padding:8px 14px;font-size:13px}
.save{font-size:12px;color:#9be39c}
.lay{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;max-width:1500px;margin:18px auto;padding:0 18px}
.ed{min-width:0}
.side,.ed{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.side{align-self:start;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto}
.side h4{font-size:13px;color:var(--muted);margin:6px 4px 10px}
.citem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.citem:hover{background:var(--bg)}
.citem.on{border-color:var(--gold);background:var(--gold-l)}
.citem .blogo{width:36px;height:36px;border-radius:10px}
.citem .blogo span{font-size:16px}
.citem b{display:block;font-size:14px;line-height:1.3}
.citem small{color:var(--muted);font-size:12px}
.citem.hid{opacity:.5}
fieldset{border:0;margin-bottom:18px;min-width:0}
legend{font-family:var(--fd);font-weight:800;font-size:18px;margin-bottom:10px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
label.f.wide{grid-column:1/-1}
input.i,textarea.i,select.i{font:inherit;font-size:14px;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
input.i:focus,textarea.i:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea.i{min-height:80px;resize:vertical}
.ltr-i{direction:ltr;text-align:left}
.logo-up{display:flex;gap:12px;align-items:center}
.logo-up .blogo{width:72px;height:72px}
.hint{font-size:12px;color:var(--muted)}
.ctab{overflow:auto;border:1px solid var(--line);border-radius:12px}
.ctab table{font-size:13px}
.ctab th{background:var(--black);color:#ddd;cursor:default;font-size:12px;padding:9px 8px}
.ctab td{padding:5px 4px;border-top:1px solid var(--line)}
.ctab input{font:inherit;font-size:13px;border:1px solid transparent;border-radius:7px;padding:6px 7px;width:100%;background:transparent;min-width:60px}
.ctab input:hover{border-color:var(--line2)}
.ctab input:focus{border-color:var(--gold);background:#fff;outline:0}
.ctab input.url{min-width:250px;direction:ltr}
.ctab input.n{min-width:78px;direction:ltr;text-align:right}
.ctab input.u{min-width:120px;direction:ltr}
.ctab input.note{min-width:200px}
.ctab tr.dup td{background:#fff4e5}
.ic-b{border:0;background:none;width:28px;height:28px;border-radius:7px;color:var(--muted)}
.ic-b:hover{background:var(--bg);color:var(--ink)}
.ic-b.del:hover{background:#fde8e8;color:#c62828}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.warn{background:#fff4e5;border:1px solid #f5c87a;color:#7a4d00;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.dlg.open{display:flex}
.dlg .box{background:#fff;border-radius:18px;padding:22px;width:min(720px,100%);max-height:90vh;overflow:auto}
.dlg h3{margin-bottom:8px}
.sumg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sb{background:var(--bg);border-radius:12px;padding:12px 14px}
.sb b{display:block;font-family:"Alexandria";font-size:20px;font-weight:800;direction:ltr;text-align:right}
.sb span{font-size:12px;color:var(--muted)}
.sb.dk{background:var(--black);color:#fff}.sb.dk b{color:var(--gold)}.sb.dk span{color:#bdb6aa}
.sb.gd{background:var(--gold)}
.ls{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.ls.ok{background:var(--green-l);color:var(--green-d)}
.ls.warn{background:#f3efe6;color:#6b665e}
.ls.bad{background:#fde8e8;color:#c62828}
@media(max-width:900px){.lay{grid-template-columns:1fr}.side{position:static;max-height:none}}
</style>
</head>
<body>
<div class="abar"><div class="wrap">
  <div class="logo" style="display:flex;align-items:center"><img src="assets/malaz-white.png" alt="ملاذ" style="height:30px"><small>لوحة تحكم البورتفوليو</small></div>
  <span class="save" id="saved"></span>
  <a class="btn" href="index.html" target="_blank">معاينة الموقع ↗</a>
  <button class="btn" id="imp">استيراد ملف</button>
  <button class="btn" id="copy">نسخ الكود</button>
  <button class="btn gold" id="exp">تصدير data.js ⬇</button>
  <input type="file" id="impf" accept=".js,.json" hidden>
</div></div>

<div class="lay">
  <aside class="side">
    <button class="btn dark" id="add" style="width:100%;justify-content:center;margin-bottom:12px">+ حملة جديدة</button>
    <h4>الحملات</h4>
    <div id="clist"></div>
    <h4 style="margin-top:18px">الإعدادات</h4>
    <div class="citem" id="agencyItem"><div class="blogo" style="background:var(--black)"><span style="color:#fff">م</span></div><div><b>بيانات الوكالة</b><small>الاسم والشعار والموقع</small></div></div>
    <button class="btn" id="reset" style="width:100%;justify-content:center;margin-top:14px;font-size:12px">تجاهل المسودة والرجوع لـ data.js</button>
  </aside>
  <main class="ed" id="ed"></main>
</div>

<div class="dlg" id="bulk"><div class="box">
  <h3>إضافة تغطيات بالجملة</h3>
  <p class="hint">الصق لينكات (كل لينك في سطر، أو انسخ عمود من الشيت). أو الصق صفوف من الشيت بالترتيب ده:<br><span class="ltr">url · username · followers · views · likes · comments · saves · note</span></p>
  <textarea class="i ltr-i" id="bulkT" style="min-height:200px;margin:10px 0"></textarea>
  <div class="row-acts"><button class="btn gold" id="bulkOk">إضافة</button><button class="btn" id="bulkNo">إلغاء</button></div>
</div></div>

<script src="data.js"></script>
<script src="assets/core.js"></script>
<script>
(function(){
const M = MZ, E = M.esc;
let { data } = M.loadData();
data = JSON.parse(JSON.stringify(data));
data.agency = data.agency || {}; data.campaigns = data.campaigns || [];
data.campaigns.forEach(c => delete c.totals);
let sel = data.campaigns.length ? 0 : -1;   // -1 = agency settings
const $ = s => document.querySelector(s);

/* ---------- persistence ---------- */
let tmr;
function save(){
  clearTimeout(tmr);
  tmr = setTimeout(()=>{
    try{ localStorage.setItem(M.DRAFT_KEY, JSON.stringify(data)); $("#saved").textContent = "✓ اتحفظ كمسودة " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
    catch(e){ $("#saved").textContent = "⚠ المساحة امتلأت — صدّر الملف"; }
  }, 300);
}
function exportText(){
  return "/* بيانات بورتفوليو ملاذ — اتولّد من admin.html في " + new Date().toISOString().slice(0,10) + " */\nwindow.PORTFOLIO = " + JSON.stringify(data, null, 2) + ";\n";
}
$("#exp").onclick = () => {
  const b = new Blob([exportText()], {type:"text/javascript"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "data.js"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
};
$("#copy").onclick = () => navigator.clipboard.writeText(exportText()).then(()=>$("#saved").textContent="✓ اتنسخ الكود").catch(()=>alert("انسخ يدويًا من التصدير"));
$("#imp").onclick = () => $("#impf").click();
$("#impf").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t=>{
    try{
      const j = t.trim().startsWith("{") ? JSON.parse(t) : JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}")+1));
      if(!j.campaigns) throw 0;
      data = j; sel = data.campaigns.length ? 0 : -1; save(); render();
    }catch(_){ alert("الملف مش بصيغة data.js صحيحة"); }
  });
};
$("#reset").onclick = () => { if(confirm("هتمسح كل التعديلات اللي مش متصدّرة. متأكد؟")){ try{localStorage.removeItem(M.DRAFT_KEY)}catch(e){} location.reload(); } };

/* ---------- helpers ---------- */
const slug = s => (String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "c") ;
function uniqId(base){ let id = slug(base), n = 2; while(data.campaigns.some(c=>c.id===id)) id = slug(base)+"-"+(n++); return id; }
const logoHTML = c => { const s = M.safeUrl(c.logo); return s ? `<div class="blogo"><img src="${E(s)}"></div>` : `<div class="blogo ph"><span>${E((c.brand||"?")[0].toUpperCase())}</span></div>`; };
function allUrls(){ const m = {}; data.campaigns.forEach((c,ci)=>(c.coverages||[]).forEach(v=>{ const k=normUrl(v.url); if(k){ (m[k]=m[k]||[]).push(c.brand||c.id); } })); return m; }
function normUrl(u){ const L = M.parseLink(u); return L.id ? L.platform+":"+L.id : (u||"").trim().replace(/\/+$/,"").toLowerCase(); }
function resizeImage(file){
  return new Promise((res,rej)=>{
    if(file.type === "image/svg+xml"){ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); return; }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const max = 320, s = Math.min(1, max/Math.max(img.width,img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); let d = cv.toDataURL("image/webp",.9); if(!d.startsWith("data:image/webp")) d = cv.toDataURL("image/png"); URL.revokeObjectURL(url); res(d); };
    img.onerror = rej; img.src = url;
  });
}

/* ---------- links ---------- */
function cleanUrl(u){
  u = (u||"").trim(); if(!u) return u;
  try{ const x = new URL(u); if(/instagram\.com$/.test(x.hostname.replace(/^www\./,""))) { x.search=""; } if(/tiktok\.com$/.test(x.hostname.replace(/^www\./,"")) && /\/video\/|\/photo\//.test(x.pathname)) x.search=""; u = x.toString().replace(/\/{2,}$/,"/"); }catch(e){}
  return u;
}
function fillFromLink(v){
  const L = M.parseLink(v.url);
  if(L.creator && !v.creator) v.creator = L.creator;
  if(L.platform && L.platform!=="Link" && !(v.platforms||[]).length) v.platforms = [L.platform];
}
const isShortTT = u => { const L = M.parseLink(u); return L.platform==="TikTok" && !L.id; };
async function resolveShort(v){
  if(!isShortTT(v.url)) return false;
  try{
    const r = await fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(v.url));
    const j = await r.json();
    if(j && j.embed_product_id){
      const user = j.author_unique_id || (j.author_url||"").split("@")[1] || "";
      v.url = "https://www.tiktok.com/@"+user+"/video/"+j.embed_product_id;
      if(!v.creator && user) v.creator = user;
      return true;
    }
  }catch(e){}
  return false;
}
function linkStatus(v){
  if(v.video) return '<span class="ls ok">▶ MP4</span>';
  if(!v.url) return "";
  const L = M.parseLink(v.url);
  if((L.platform==="TikTok"||L.platform==="Instagram"||L.platform==="YouTube") && L.id) return '<span class="ls ok" title="الفيديو هيشتغل جوه الموقع">▶ جوه الموقع</span>';
  if(L.platform==="TikTok") return '<span class="ls bad" title="لينك مختصر: افتحه في المتصفح وانسخ اللينك الكامل اللي فيه /video/">⚠ لينك مختصر</span>';
  if(L.platform==="Instagram" && L.kind==="story") return '<span class="ls warn" title="الستوري مالهاش تضمين — هتفتح في إنستغرام">↗ ستوري</span>';
  return '<span class="ls warn" title="مش هيتعرض جوه الموقع — هيفتح في صفحة المنصة">↗ برا الموقع</span>';
}

/* ---------- sidebar ---------- */
function renderSide(){
  $("#clist").innerHTML = data.campaigns.map((c,i)=>`<div class="citem ${i===sel?"on":""} ${c.hidden?"hid":""}" data-i="${i}">${logoHTML(c)}<div><b>${E((c.title||c.brand||"بدون اسم").replace(/\*/g,""))}</b><small>${E(c.brand||"")} · ${(c.coverages||[]).length} تغطية${c.hidden?" · مخفية":""}</small></div></div>`).join("") || '<p class="hint" style="padding:8px">لا توجد حملات</p>';
  document.querySelectorAll("#clist .citem").forEach(el=>el.onclick=()=>{ sel = +el.dataset.i; render(); });
  $("#agencyItem").classList.toggle("on", sel===-1);
}
$("#agencyItem").onclick = () => { sel = -1; render(); };
$("#add").onclick = () => {
  const c = { id: uniqId("campaign"), brand:"", title:"حملة جديدة", type:"حملة مشاهير", logo:"", brandUrl:"", city:"", date:"", description:"", coverages:[] };
  data.campaigns.unshift(c); sel = 0; save(); render();
  setTimeout(()=>{ const b = document.querySelector('[data-k="brand"]'); if(b) b.focus(); }, 50);
};

/* ---------- editors ---------- */
function field(k, label, val, opts={}){
  const t = opts.area ? `<textarea class="i" data-k="${k}">${E(val||"")}</textarea>` : `<input class="i ${opts.ltr?"ltr-i":""}" data-k="${k}" type="${opts.type||"text"}" value="${E(val??"")}" ${opts.list?`list="${opts.list}"`:""} placeholder="${E(opts.ph||"")}">`;
  return `<label class="f ${opts.wide?"wide":""}">${label}${t}${opts.hint?`<span class="hint">${opts.hint}</span>`:""}</label>`;
}
function renderAgency(){
  const a = data.agency;
  $("#ed").innerHTML = `<fieldset><legend>بيانات الوكالة</legend><div class="fg">
    ${field("name","اسم الوكالة",a.name)}${field("site","موقع الوكالة",a.site,{ltr:1})}
    ${field("slogan","الشعار",a.slogan,{wide:1})}${field("influencersPool","رقم قاعدة المؤثرين (يظهر في الرئيسية)",a.influencersPool,{ltr:1,ph:"+5000"})}
  </div></fieldset>`;
  $("#ed").querySelectorAll("[data-k]").forEach(inp=>inp.oninput=()=>{ a[inp.dataset.k] = inp.value; save(); });
}
function renderCampaign(){
  const c = data.campaigns[sel]; if(!c){ $("#ed").innerHTML = '<div class="empty">اختار حملة أو أضف واحدة جديدة.</div>'; return; }
  c.coverages = c.coverages || [];
  const dups = allUrls();
  const nd = c.coverages.filter(v=>{ const k=normUrl(v.url); return k && dups[k] && dups[k].length>1; }).length;
  $("#ed").innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <h2 style="font-size:24px">${E((c.title||c.brand||"حملة").replace(/\*/g,""))}</h2>
    <div class="row-acts" style="margin:0">
      <a class="btn" href="index.html#c-${E(c.id)}" target="_blank">فتح صفحة الحملة ↗</a>
      <button class="btn" id="up">↑</button><button class="btn" id="dn">↓</button>
      <button class="btn" id="hide">${c.hidden?"إظهار":"إخفاء"}</button>
      <button class="btn" id="delc" style="color:#c62828">حذف الحملة</button>
    </div>
  </div>
  <fieldset><legend>البراند والحملة</legend>
    <div class="logo-up" style="margin-bottom:14px">${logoHTML(c)}
      <div style="display:flex;flex-direction:column;gap:6px;flex:1">
        <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn" style="cursor:pointer">رفع لوجو البراند<input type="file" id="logoF" accept="image/*" hidden></label>${c.logo?'<button class="btn" id="logoX">إزالة</button>':""}</div>
        <input class="i ltr-i" id="logoP" placeholder="أو مسار ملف: logos/brand.png" value="${c.logo && !c.logo.startsWith("data:")?E(c.logo):""}">
        <span class="hint">اللوجو المرفوع يتحفظ جوه data.js (بيتصغّر تلقائيًا). PNG شفاف أو SVG أفضل.</span>
      </div></div>
    <div class="fg">
      ${field("brand","اسم البراند",c.brand)}
      ${field("title","عنوان الحملة",c.title,{hint:"حط الكلمة اللي عايزها بالذهبي بين نجمتين: إطلاق *حلاي كرانشي* في الرياض"})}
      ${field("type","نوع الحملة / الافتتاح",c.type,{list:"types"})}
      ${field("brandUrl","لينك البراند (موقع أو حساب)",c.brandUrl,{ltr:1,ph:"https://"})}
      ${field("city","المدينة / الفرع",c.city)}
      ${field("date","تاريخ الحملة",c.date,{type:"date"})}
      ${field("id","رابط الصفحة (id)",c.id,{ltr:1,hint:"يظهر في اللينك: #c-"+E(c.id)})}
      ${field("dataDate","تاريخ تحديث الأرقام",c.dataDate,{type:"date"})}
      <label class="f">هاشتاجات الشريط المتحرك<input class="i" data-arr="hashtags" value="${E((c.hashtags||[]).join("، "))}" placeholder="حلاي_كرانشي، حلاي_كافيه"></label>
      ${field("description","وصف الحملة",c.description,{area:1,wide:1})}
    </div>
    <datalist id="types"><option>حملة مشاهير</option><option>افتتاح فرع</option><option>إطلاق منتج</option><option>تغطية UGC</option><option>Brand Campaign</option><option>زيارات فروع</option></datalist>
  </fieldset>
  <fieldset><legend>ما تعلمناه للحملات القادمة <span class="hint" style="font-family:var(--fb);font-weight:400">(اختياري — لو فاضي الموقع بيطلّع ملاحظات تلقائية من الأرقام)</span></legend>
    <div class="fg">${[0,1,2].map(i=>{ const x=(c.insights||[])[i]||{}; return `<div style="display:flex;flex-direction:column;gap:6px"><input class="i" data-ins="${i}" data-f="title" value="${E(x.title||"")}" placeholder="عنوان الملاحظة ${i+1}"><textarea class="i" data-ins="${i}" data-f="body" placeholder="التفاصيل">${E(x.body||"")}</textarea></div>`; }).join("")}</div>
  </fieldset>
  <fieldset><legend>إجماليات الحملة <span class="hint" style="font-family:var(--fb);font-weight:400">(بتتحسب تلقائيًا من أرقام التغطيات تحت)</span></legend>
    <div class="sumg" id="sum"></div>
  </fieldset>
  <fieldset><legend>التغطيات (${c.coverages.length})</legend>
    ${nd?`<div class="warn">فيه ${nd} لينك متكرر في حملة تانية أو في نفس الحملة (متعلّم باللون البرتقالي) — راجعه.</div>`:""}
    <div class="ctab"><table><thead><tr><th>#</th><th>لينك التغطية</th><th>الفيديو</th><th>اليوزر</th><th>المنصات</th><th>التغطية</th><th>النوع</th><th>الموقع</th><th>متابعين</th><th>مشاهدات</th><th>لايكات</th><th>كومنتات</th><th>حفظ</th><th>فيديو MP4</th><th>ملاحظة</th><th></th></tr></thead>
    <tbody>${c.coverages.map((v,i)=>{ const k=normUrl(v.url); const d = k && dups[k] && dups[k].length>1; return `<tr data-i="${i}" class="${d?"dup":""}" title="${d?"متكرر في: "+E(dups[k].join("، ")):""}">
      <td class="num">${i+1}</td>
      <td><input class="url" data-c="url" value="${E(v.url||"")}" placeholder="https://www.tiktok.com/@user/video/…"></td>
      <td class="stc">${linkStatus(v)}</td>
      <td><input class="u" data-c="creator" value="${E(v.creator||"")}"></td>
      <td><input class="u" data-c="platforms" value="${E((v.platforms||[]).join(", "))}" placeholder="TikTok, Instagram"></td>
      <td><input class="u" data-c="formats" value="${E((v.formats||[]).join(", "))}" placeholder="Reel, Stories"></td>
      <td><input class="u" data-c="kind" value="${E(v.kind||"")}" placeholder="Visit"></td>
      <td><input class="u" data-c="location" value="${E(v.location||"")}"></td>
      ${["followers","views","likes","comments","saves"].map(k=>`<td><input class="n" data-c="${k}" inputmode="numeric" value="${v[k]??""}"></td>`).join("")}
      <td><input class="u" data-c="video" value="${E(v.video||"")}" placeholder="videos/x.mp4"></td>
      <td><input class="note" data-c="note" value="${E(v.note||"")}"></td>
      <td style="white-space:nowrap"><button class="ic-b" data-a="up" title="لفوق">↑</button><button class="ic-b del" data-a="del" title="حذف">✕</button></td></tr>`; }).join("")}</tbody></table></div>
    <div class="row-acts"><button class="btn dark" id="addRow">+ تغطية</button><button class="btn gold" id="bulkBtn">إضافة لينكات بالجملة</button></div>
    <p class="hint" style="margin-top:10px">الصق لينك تيك توك وهو بيطلّع اليوزر والمنصة لوحده. الفيديو بيشتغل جوه الموقع من لينك تيك توك أو إنستغرام أو يوتيوب، أو من ملف MP4 (حطه في فولدر videos واكتب مساره) — ملف MP4 بيدي أحسن تجربة.</p>
  </fieldset>`;

  const ed = $("#ed");
  ed.querySelectorAll("[data-k]").forEach(inp=>inp.oninput=()=>{
    const k = inp.dataset.k;
    if(k==="id"){ const v = slug(inp.value); if(v && !data.campaigns.some((x,j)=>j!==sel && x.id===v)) c.id = v; }
    else c[k] = inp.value;
    save(); if(k==="brand"||k==="title") renderSide();
  });
  ed.querySelectorAll("[data-arr]").forEach(inp=>inp.oninput=()=>{ c[inp.dataset.arr] = inp.value.split(/[,،]/).map(x=>x.trim().replace(/^#/,"")).filter(Boolean); save(); });
  ed.querySelectorAll("[data-ins]").forEach(inp=>inp.oninput=()=>{
    c.insights = c.insights || []; const i = +inp.dataset.ins; c.insights[i] = c.insights[i] || {title:"",body:""}; c.insights[i][inp.dataset.f] = inp.value;
    c.insights = c.insights.map(x=>x||{title:"",body:""}); if(c.insights.every(x=>!x.title&&!x.body)) delete c.insights; save();
  });
  const updSum = () => {
    const { s:st } = M.campStats(c);
    const box = (v,l,cls="") => `<div class="sb ${cls}"><b class="num">${v}</b><span>${l}</span></div>`;
    $("#sum").innerHTML = box(M.fmt(st.creators),"مؤثر") + box(M.fmt(st.views),"مشاهدة","dk") + box(M.fmt(st.followers),"متابع مجتمعين") + box(M.fmt(st.likes),"إعجاب") + box(M.fmt(st.comments),"تعليق") + box(M.fmt(st.saves),"حفظ ومشاركة") + box(M.pct(st.er),"نسبة التفاعل","gd");
  };
  updSum();
  $("#logoF").onchange = async e => { const f = e.target.files[0]; if(!f) return; try{ c.logo = await resizeImage(f); save(); render(); }catch(_){ alert("تعذّر قراءة الصورة"); } };
  $("#logoP").oninput = e => { c.logo = e.target.value.trim(); save(); renderSide(); };
  if($("#logoX")) $("#logoX").onclick = () => { c.logo = ""; save(); render(); };
  $("#up").onclick = () => { if(sel>0){ [data.campaigns[sel-1],data.campaigns[sel]]=[data.campaigns[sel],data.campaigns[sel-1]]; sel--; save(); render(); } };
  $("#dn").onclick = () => { if(sel<data.campaigns.length-1){ [data.campaigns[sel+1],data.campaigns[sel]]=[data.campaigns[sel],data.campaigns[sel+1]]; sel++; save(); render(); } };
  $("#hide").onclick = () => { c.hidden = !c.hidden; if(!c.hidden) delete c.hidden; save(); render(); };
  $("#delc").onclick = () => { if(confirm("حذف حملة «"+(c.title||c.brand)+"» نهائيًا؟")){ data.campaigns.splice(sel,1); sel = data.campaigns.length?0:-1; save(); render(); } };

  ed.querySelectorAll("tbody tr").forEach(tr=>{
    const v = c.coverages[+tr.dataset.i];
    tr.querySelectorAll("input[data-c]").forEach(inp=>{
      inp.oninput = () => {
        const k = inp.dataset.c, val = inp.value;
        if(["followers","views","likes","comments","saves"].includes(k)){ const n = val.replace(/[,\s]/g,""); v[k] = n===""||isNaN(+n) ? null : +n; }
        else if(k==="platforms"||k==="formats") v[k] = val.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
        else v[k] = val.trim();
        save(); if(["followers","views","likes","comments","saves","creator"].includes(k)) updSum();
      };
      if(inp.dataset.c==="url") inp.onchange = async () => {
        v.url = cleanUrl(v.url);
        await resolveShort(v);
        fillFromLink(v);
        save(); render();
      };
    });
    tr.querySelector('[data-a="del"]').onclick = () => { c.coverages.splice(+tr.dataset.i,1); save(); render(); };
    tr.querySelector('[data-a="up"]').onclick = () => { const i=+tr.dataset.i; if(i>0){ [c.coverages[i-1],c.coverages[i]]=[c.coverages[i],c.coverages[i-1]]; save(); render(); } };
  });
  $("#addRow").onclick = () => { c.coverages.push({url:"",creator:"",platforms:[],formats:[],kind:"",location:"",followers:null,views:null,likes:null,comments:null,saves:null,video:"",note:""}); save(); render(); const r = ed.querySelectorAll("tbody tr"); r[r.length-1].querySelector("input").focus(); };
  $("#bulkBtn").onclick = () => { $("#bulkT").value=""; $("#bulk").classList.add("open"); $("#bulkT").focus(); };
}
$("#bulkNo").onclick = () => $("#bulk").classList.remove("open");
$("#bulkOk").onclick = async () => {
  const c = data.campaigns[sel]; if(!c) return;
  const txt = $("#bulkT").value, num = s => { const n=(s||"").replace(/[,\s]/g,""); return n===""||isNaN(+n)?null:+n; };
  let added = 0;
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    if(line.includes("\t")){
      const p = line.split("\t");
      const urlCell = p.find(x=>/^https?:\/\//i.test(x.trim()));
      if(!urlCell && !p[1]) return;
      const v = { url:(p[0]||"").trim(), creator:(p[1]||"").trim().replace(/^@/,""), followers:num(p[2]), views:num(p[3]), likes:num(p[4]), comments:num(p[5]), saves:num(p[6]), note:(p[7]||"").trim() };
      const L = M.parseLink(v.url); if(!v.creator) v.creator = L.creator; v.platforms = L.platform && L.platform!=="Link" ? [L.platform] : [];
      c.coverages.push(v); added++;
    } else {
      (line.match(/https?:\/\/[^\s,]+/g)||[]).forEach(u=>{ u = u.replace(/\/{2,}$/,"/"); const L = M.parseLink(u); c.coverages.push({url:u, creator:L.creator||"", platforms:L.platform&&L.platform!=="Link"?[L.platform]:[]}); added++; });
    }
  });
  $("#bulk").classList.remove("open");
  c.coverages.forEach(v=>{ v.url = cleanUrl(v.url); });
  const shorts = c.coverages.filter(v=>isShortTT(v.url));
  let fixed = 0; for(const v of shorts){ if(await resolveShort(v)) fixed++; fillFromLink(v); }
  save(); render();
  const left = shorts.length - fixed;
  setTimeout(()=>{ $("#saved").textContent = "✓ اتضاف " + added + " تغطية" + (left?` — ${left} لينك مختصر محتاج تنسخ لينكه الكامل`:""); }, 400);
};

function render(){ renderSide(); if(sel===-1) renderAgency(); else renderCampaign(); }
render();
})();
</script>
</body>
</html>
